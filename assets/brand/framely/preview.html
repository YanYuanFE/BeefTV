<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:32px;background:#e9e9ea;font-family:-apple-system,"PingFang SC",sans-serif}
.tile{border-radius:16px;display:grid;place-items:center;min-height:260px}
.dark{background:#121213}.light{background:#fafafa}
.word{display:flex;align-items:center;gap:14px;font-size:44px;font-weight:650;letter-spacing:-0.02em}
.small{display:flex;gap:18px;align-items:center}
</style></head><body>
<div class="tile dark"><img src="framely-mark.svg" width="180"></div>
<div class="tile light"><img src="framely-mark-dark.svg" width="180"></div>
<div class="tile light"><img src="framely-app-icon.svg" width="220"></div>
<div class="tile dark"><img src="framely-wordmark.svg" width="300"></div>
<div class="tile light"><img src="framely-wordmark-dark.svg" width="300"></div>
<div class="tile dark"><div class="small"><img src="framely-mark.svg" width="16"><img src="framely-mark.svg" width="24"><img src="framely-mark.svg" width="32"><img src="framely-app-icon.svg" width="32"><img src="framely-app-icon.svg" width="64"></div></div>
</body></html>
